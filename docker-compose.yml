services:
  app:
    build: .
    image: ezycommerce-app:latest
    container_name: ezycommerce_app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - upload_data:/var/www/html/uploads
      - log_data:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ezycommerce_network

  db:
    image: mysql:8
    container_name: ezycommerce_db
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ecomm}
      MYSQL_USER: ${DB_USER:-ezy_user}
      MYSQL_PASSWORD: ${DB_PASS:-ezy_pass}
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-file-size=16M
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --max-connections=30
      --performance-schema=OFF
      --table-open-cache=200
      --tmp-table-size=16M
      --max-heap-table-size=16M
      --key-buffer-size=8M
      --thread-cache-size=4
      --host-cache-size=0
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seeds/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ezycommerce_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ezycommerce_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    depends_on:
      - db
    networks:
      - ezycommerce_network

volumes:
  mysql_data:
  upload_data:
  log_data:

networks:
  ezycommerce_network:
    driver: bridge