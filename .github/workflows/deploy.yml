name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ezycommerce

            git pull origin main

            docker compose down
            docker compose up -d --build

            # Wait for DB healthcheck to pass
            echo "Waiting for database to be ready..."
            for i in $(seq 1 30); do
              if docker exec ezycommerce_db mysqladmin ping -h localhost -u root -proot_password &>/dev/null; then
                echo "Database is ready!"
                break
              fi
              echo "Attempt $i/30 - waiting..."
              sleep 2
            done

            # Run migrations and seed
            docker exec ezycommerce_app php vendor/bin/phinx migrate -e production
            docker exec ezycommerce_app php vendor/bin/phinx seed:run -e production || true

            # Health check with retry
            echo "Running health check..."
            for i in $(seq 1 5); do
              if curl -sf http://localhost:8080 > /dev/null; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Health check attempt $i/5 failed, retrying..."
              sleep 3
            done
            echo "Health check failed after 5 attempts"
            exit 1