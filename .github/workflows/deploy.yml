name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            cd /path/to/your/deployment/ezycommerce
            
            git pull origin main
            
            docker-compose down
            docker-compose up -d --build
            
            # wait for container
            sleep 10
            
            docker exec -i ezycommerce_app php vendor/bin/phinx migrate -e production
            docker exec -i ezycommerce_app php vendor/bin/phinx seed:run -e production || true
            
            # health check
            curl -f http://localhost:8080 || exit 1